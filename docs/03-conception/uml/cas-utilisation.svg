    <text x="430" y="164">Se connecter</text>
    <text x="430" y="234">Construire un warband</text>
    <text x="430" y="304">Calculer les probabilités de réussite</text>
    <text x="430" y="364">Partager un warband par lien</text>
    <text x="430" y="424">Exporter un warband en PDF</text>
