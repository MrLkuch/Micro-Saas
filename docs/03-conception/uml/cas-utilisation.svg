    <text x="770" y="544">Consulter un warband partagé</text>
    <text x="770" y="624">Simuler une confrontation</text>
  </g>

  <!-- ===== Acteurs ===== -->
  <g stroke="#000000" stroke-width="1.4" fill="none">
    <!-- Joueur -->
    <circle cx="110" cy="250" r="11" fill="#FFFFFF"/>
    <line x1="110" y1="261" x2="110" y2="300"/>
    <line x1="88" y1="275" x2="132" y2="275"/>
    <line x1="110" y1="300" x2="92" y2="328"/>
    <line x1="110" y1="300" x2="128" y2="328"/>
    <!-- Administrateur -->
    <circle cx="110" cy="580" r="11" fill="#FFFFFF"/>
    <line x1="110" y1="591" x2="110" y2="630"/>
    <line x1="88" y1="605" x2="132" y2="605"/>
    <line x1="110" y1="630" x2="92" y2="658"/>
    <line x1="110" y1="630" x2="128" y2="658"/>
    <!-- Adversaire -->
    <circle cx="1080" cy="520" r="11" fill="#FFFFFF"/>
    <line x1="1080" y1="531" x2="1080" y2="570"/>
    <line x1="1058" y1="545" x2="1102" y2="545"/>
    <line x1="1080" y1="570" x2="1062" y2="598"/>
    <line x1="1080" y1="570" x2="1098" y2="598"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="110" y="348">Joueur</text>
    <text x="110" y="678">Administrateur</text>
    <text x="1080" y="618">Adversaire</text>
