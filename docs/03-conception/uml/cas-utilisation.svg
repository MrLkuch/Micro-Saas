<svg width="1200" height="740" viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="740" fill="#FFFFFF"/>

  <!-- Limite du systeme -->
  <rect x="270" y="30" width="660" height="680" fill="none" stroke="#000000" stroke-width="1.2"/>
  <text x="600" y="54" text-anchor="middle" font-weight="bold" font-size="15">ForgeRoster</text>

  <!-- ===== Associations acteurs / cas ===== -->
  <g stroke="#000000" stroke-width="1" fill="none">
    <!-- Joueur -->
    <line x1="140" y1="290" x2="305" y2="100"/>
    <line x1="140" y1="290" x2="305" y2="160"/>
    <line x1="140" y1="290" x2="305" y2="230"/>
    <line x1="140" y1="290" x2="305" y2="300"/>
    <line x1="140" y1="290" x2="305" y2="360"/>
    <line x1="140" y1="290" x2="305" y2="420"/>
    <line x1="140" y1="290" x2="305" y2="480"/>
    <!-- Administrateur -->
    <line x1="140" y1="620" x2="305" y2="640"/>
    <path d="M96 566 Q40 520 40 420 L40 260 Q40 60 220 130 L308 154"/>
    <!-- Adversaire -->
    <line x1="1050" y1="560" x2="895" y2="540"/>
    <line x1="1050" y1="560" x2="895" y2="620"/>
  </g>

  <!-- ===== Relations extend ===== -->
  <g stroke="#000000" stroke-width="1" fill="none" stroke-dasharray="6 4">
    <line x1="645" y1="200" x2="553" y2="222" marker-end="url(#open-arrow)"/>
    <line x1="645" y1="262" x2="553" y2="238" marker-end="url(#open-arrow)"/>
    <line x1="770" y1="596" x2="770" y2="566" marker-end="url(#open-arrow)"/>
  </g>
  <text x="598" y="198" text-anchor="middle" font-size="11">«extend»</text>
  <text x="598" y="268" text-anchor="middle" font-size="11">«extend»</text>
  <text x="806" y="585" text-anchor="middle" font-size="11">«extend»</text>

  <!-- ===== Cas d'utilisation : colonne gauche ===== -->
  <g fill="#FFFFFF" stroke="#000000" stroke-width="1.2">
    <ellipse cx="430" cy="100" rx="125" ry="24"/>
    <ellipse cx="430" cy="160" rx="125" ry="24"/>
    <ellipse cx="430" cy="230" rx="125" ry="24"/>
    <ellipse cx="430" cy="300" rx="125" ry="24"/>
    <ellipse cx="430" cy="360" rx="125" ry="24"/>
    <ellipse cx="430" cy="420" rx="125" ry="24"/>
    <ellipse cx="430" cy="480" rx="125" ry="24"/>
    <ellipse cx="430" cy="640" rx="125" ry="24"/>
    <!-- colonne droite -->
    <ellipse cx="770" cy="195" rx="125" ry="24"/>
    <ellipse cx="770" cy="265" rx="125" ry="24"/>
    <ellipse cx="770" cy="540" rx="125" ry="24"/>
    <ellipse cx="770" cy="620" rx="125" ry="24"/>
  </g>
  <g text-anchor="middle" fill="#000000">
